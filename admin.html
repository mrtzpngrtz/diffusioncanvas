<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Diffusion Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: #2a2a2a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #404040;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #8899ff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #404040;
        }

        .stat-card h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 500;
        }

        .users-section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #404040;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h2 {
            font-size: 18px;
            margin: 0;
        }

        .add-user-btn {
            padding: 10px 20px;
            background: #667eea;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .add-user-btn:hover {
            background: #7c8df5;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th {
            background: #2a2a2a;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid #404040;
        }

        .users-table td {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .users-table tr:hover {
            background: #2a2a2a;
        }

        .user-photo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            background: #333;
            color: #aaa;
        }

        .badge.admin {
            background: #667eea;
            color: #fff;
        }

        .delete-btn {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #ff4444;
            border-radius: 4px;
            color: #ff4444;
            cursor: pointer;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .delete-btn:hover:not(:disabled) {
            background: #ff4444;
            color: #fff;
        }

        .delete-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            background: #3a0000;
            border: 1px solid #ff4444;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ff4444;
        }

        .success {
            background: #003a00;
            border: 1px solid #44ff44;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #44ff44;
        }

        .no-users {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .credits-input {
            width: 80px;
            padding: 6px 8px;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            text-align: center;
        }

        .credits-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .credits-input::-webkit-inner-spin-button,
        .credits-input::-webkit-outer-spin-button {
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            margin: 0;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group-checkbox input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .form-group-checkbox label {
            margin: 0;
            cursor: pointer;
            text-transform: none;
            font-size: 14px;
            color: #e0e0e0;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: #fff;
        }

        .btn-primary:hover {
            background: #7c8df5;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: #888;
            border: 1px solid #404040;
        }

        .btn-secondary:hover {
            background: #2a2a2a;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <p>User management for Diffusion Canvas</p>
            <a href="/" class="back-link">← Back to Application</a>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Admin Users</h3>
                <div class="value" id="adminUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>Regular Users</h3>
                <div class="value" id="regularUsers">-</div>
            </div>
        </div>

        <div class="users-section">
            <div class="section-header">
                <h2>Registered Users</h2>
                <button class="add-user-btn" id="addUserBtn">+ Add User</button>
            </div>
            <div id="loading" class="loading">Loading users...</div>
            <div id="noUsers" class="no-users" style="display: none;">No users registered yet</div>
            <table class="users-table" id="usersTable" style="display: none;">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Provider</th>
                        <th>Role</th>
                        <th>Credits</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New User</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="newUsername">Username *</label>
                    <input type="text" id="newUsername" name="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="newPassword">Password * (min. 6 characters)</label>
                    <input type="password" id="newPassword" name="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="newIsAdmin" name="isAdmin">
                        <label for="newIsAdmin">Make this user an administrator</label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="createUserBtn">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUserId = null;

        // Check if user is authenticated and is admin
        async function checkAdminAccess() {
            try {
                const response = await fetch('/api/user', {
                    credentials: 'include'
                });
                const data = await response.json();

                if (!data.user) {
                    window.location.href = '/';
                    return;
                }

                currentUserId = data.user.id;

                if (!data.user.isAdmin) {
                    showError('Access denied. Admin privileges required.');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                    return;
                }

                loadUsers();
            } catch (error) {
                showError('Failed to verify admin access');
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }
        }

        // Load all users
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                showError('Failed to load users: ' + error.message);
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Display users in table
        function displayUsers(users) {
            document.getElementById('loading').style.display = 'none';

            if (users.length === 0) {
                document.getElementById('noUsers').style.display = 'block';
                updateStats(users);
                return;
            }

            document.getElementById('usersTable').style.display = 'table';
            
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                const displayName = user.username || user.displayName || 'Unknown User';
                const photoUrl = user.photo || 'https://via.placeholder.com/32?text=' + displayName.charAt(0).toUpperCase();
                
                tr.innerHTML = `
                    <td>
                        <img src="${photoUrl}" 
                             alt="${displayName}" 
                             class="user-photo"
                             onerror="this.src='https://via.placeholder.com/32?text=${displayName.charAt(0).toUpperCase()}'">
                        ${displayName}
                    </td>
                    <td>${user.email || '-'}</td>
                    <td>${capitalizeFirst(user.provider)}</td>
                    <td>
                        <span class="badge ${user.isAdmin ? 'admin' : ''}">
                            ${user.isAdmin ? 'Admin' : 'User'}
                        </span>
                    </td>
                    <td>
                        <input type="number" 
                               class="credits-input" 
                               value="${user.credits || 0}" 
                               min="0"
                               data-user-id="${user.id}"
                               onchange="updateCredits('${user.id}', this.value)">
                    </td>
                    <td>${formatDate(user.createdAt)}</td>
                    <td>
                        <button class="delete-btn" 
                                onclick="deleteUser('${user.id}', '${displayName}')"
                                ${user.id === currentUserId || user.isAdmin ? 'disabled' : ''}>
                            ${user.id === currentUserId ? 'You' : user.isAdmin ? 'Admin' : 'Delete'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            updateStats(users);
        }

        // Update statistics
        function updateStats(users) {
            const total = users.length;
            const admins = users.filter(u => u.isAdmin).length;
            const regular = total - admins;

            document.getElementById('totalUsers').textContent = total;
            document.getElementById('adminUsers').textContent = admins;
            document.getElementById('regularUsers').textContent = regular;
        }

        // Update credits
        async function updateCredits(userId, credits) {
            const creditsNum = parseInt(credits);
            if (isNaN(creditsNum) || creditsNum < 0) {
                showError('Invalid credits value');
                loadUsers();
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}/credits`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ credits: creditsNum })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to update credits');
                }

                loadUsers();
            } catch (error) {
                showError('Failed to update credits: ' + error.message);
                loadUsers();
            }
        }

        // Delete user
        async function deleteUser(userId, userName) {
            if (!confirm(`Are you sure you want to delete user "${userName}"? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to delete user');
                }

                showSuccess('User deleted successfully');
                loadUsers();
            } catch (error) {
                showError('Failed to delete user: ' + error.message);
            }
        }

        // Modal management
        const modal = document.getElementById('addUserModal');
        const addUserBtn = document.getElementById('addUserBtn');
        const closeModalBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const addUserForm = document.getElementById('addUserForm');

        addUserBtn.addEventListener('click', () => {
            modal.classList.add('active');
            document.getElementById('newUsername').focus();
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            addUserForm.reset();
        });

        cancelBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            addUserForm.reset();
        });

        // Close modal on background click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
                addUserForm.reset();
            }
        });

        // Add user form submission
        addUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const createUserBtn = document.getElementById('createUserBtn');
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const isAdmin = document.getElementById('newIsAdmin').checked;

            if (!username || !password) {
                showError('Username and password are required');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters long');
                return;
            }

            // Disable button while creating
            createUserBtn.disabled = true;
            createUserBtn.textContent = 'Creating...';

            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, isAdmin })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to create user');
                }

                showSuccess(`User "${username}" created successfully`);
                modal.classList.remove('active');
                addUserForm.reset();
                loadUsers();
            } catch (error) {
                showError('Failed to create user: ' + error.message);
            } finally {
                createUserBtn.disabled = false;
                createUserBtn.textContent = 'Create User';
            }
        });

        // Helper functions
        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 5000);
        }

        // Initialize
        checkAdminAccess();
    </script>
</body>
</html>
