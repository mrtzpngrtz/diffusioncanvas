<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion Canvas - Node-Based Image Prompting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Password Modal -->
    <div class="password-modal" id="passwordModal">
        <div class="password-container">
            <h2>Access Required</h2>
            <p>Enter password to access Diffusion Canvas</p>
            <input type="password" id="passwordInput" placeholder="Enter password">
            <button id="passwordSubmit">Submit</button>
            <p class="password-error" id="passwordError"></p>
        </div>
    </div>

    <div class="header">
        <div class="header-content">
            <div class="header-text">
                <h1>Diffusion Canvas</h1>
                <p>node based prompting for people who dont like chat windows for image editing</p>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle day/night mode">
                <span class="theme-icon">☀️</span>
            </button>
        </div>
    </div>
 
    <div class="toolbar">
        <button id="addImageNode" class="btn">Add Image Node</button>
        <button id="addPromptNode" class="btn">Add Prompt Node</button>
        <button id="addActionNode" class="btn">Add Action Node</button>
        <button id="clearCanvas" class="btn btn-danger">Clear Canvas</button>
        <div class="status" id="status">Ready</div>
    </div>

    <div class="canvas-container">
        <canvas id="connectionCanvas"></canvas>
        <div id="nodeCanvas" class="node-canvas"></div>
        
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomOut">-</button>
            <span class="zoom-level" id="zoomLevel">100%</span>
            <button class="zoom-btn" id="zoomIn">+</button>
            <button class="zoom-btn" id="zoomReset">Reset</button>
        </div>
        
        <div class="minimap">
            <canvas class="minimap-canvas" id="minimapCanvas"></canvas>
            <div class="minimap-viewport" id="minimapViewport"></div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img id="lightboxImage" src="" alt="Full size image">
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="addImage">Add Image Node</div>
        <div class="context-menu-item" data-action="addPrompt">Add Prompt Node</div>
        <div class="context-menu-item" data-action="addAction">Add Action Node</div>
    </div>

    <footer class="footer">
        <p>barely made by <a href="https://www.moritzpongratz.com" target="_blank">www.moritzpongratz.com</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
